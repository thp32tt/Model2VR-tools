name: Daytona native stereo Win32 producer and Win64 Quest OpenXR release

on:
  push:
    paths:
      - 'src/probe/daytona_native_stereo.*'
      - 'src/probe/daytona_stereo_color_evidence.hpp'
      - 'tests/daytona_mono_content_evidence_test.cpp'
      - 'src/probe/d3d9_*'
      - 'src/probe/verified_world_bridge.*'
      - 'src/vr/**'
      - 'tests/model2_*'
      - 'src/probe/daytona_triangle_eye_shift.hpp'
      - 'src/probe/daytona_surface_transfer_gate.hpp'
      - 'src/probe/daytona_readback_scale.hpp'
      - 'tests/daytona_readback_scale_test.cpp'
      - 'tests/daytona_triangle_eye_shift_test.cpp'
      - 'tests/daytona_surface_transfer_gate_test.cpp'
      - 'src/probe/daytona_eye_pose_gate.hpp'
      - 'src/probe/daytona_source_pose_commit_gate.hpp'
      - 'tests/daytona_source_pose_commit_gate_test.cpp'
      - 'tests/daytona_eye_pose_gate_test.cpp'
      - 'tests/d3d11_openxr_typeless_upload_test.cpp'
      - 'src/probe/d3d9_probe.cpp'
      - 'src/probe/original_d3d9_*.hpp'
      - 'src/probe/original_d3d9_*.inl'
      - 'tools/model2_draw_source_report.py'
      - 'src/probe/config.*'
      - 'src/probe/hooks_x86.cpp'
      - 'src/loader/main.cpp'
      - 'src/common/**'
      - 'host/**'
      - 'CMakeLists.txt'
      - 'config/daytona_native_stereo.ini'
      - 'scripts/Run-Daytona-NativeStereo.cmd'
      - 'scripts/Run-Daytona-VR.bat'
      - 'scripts/Collect-Daytona-Original-Evidence.ps1'
      - 'scripts/Collect-Daytona-Original-Evidence.cmd'
      - 'tests/test_daytona_private_capture_bundle.py'
      - 'tools/model2_world_pass_evidence.py'
      - 'tests/test_model2_world_pass_evidence.py'
      - 'src/common/daytona_host_ready.hpp'
      - 'tests/test_daytona_native_stereo.py'
      - 'tests/test_model2_up_draw_outcomes.py'
      - 'tools/model2_up_draw_outcomes.py'
      - 'tools/model2_camera_state_phase_report.py'
      - 'tests/test_model2_camera_state_phase.py'
      - 'scripts/Analyze-Daytona-UP-Source.cmd'
      - 'scripts/Analyze-Daytona-Transform-Source.cmd'
      - 'docs/MODEL2_WORLD_PASS_EVIDENCE.md'
      - 'tests/daytona_wizard_health_test.cpp'
      - 'docs/vr_wizard/**'
      - 'docs/DAYTONA_NATIVE_STEREO.md'
      - '.github/workflows/daytona-native-stereo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-win32:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate original-game and FFB-safe stereo integration
        run: python -m unittest discover -s tests -p test_daytona_native_stereo.py -v
      - name: Verify authentic source UP HRESULT and original Present evidence
        run: python -m unittest discover -s tests -p test_model2_up_draw_outcomes.py -v
      - name: Validate original transform and VS-camera write evidence
        run: python -m unittest discover -s tests -p test_model2_camera_state_phase.py -v
      - name: Audit authentic original GPU-to-CPU Surface readback source
        run: python -m unittest discover -s tests -p test_model2_gpu_readback_source.py -v
      - name: Verify local-only private seven-session capture bundle
        run: python -m unittest discover -s tests -p test_daytona_private_capture_bundle.py -v
      - name: Verify individual original x86 physical source preflight and private A/B cross-session audit
        run: python -m unittest discover -s tests -p test_model2_world_pass_evidence.py -v
      - name: Parse user-shipped Windows PowerShell capture workflow
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Collect-Daytona-Original-Evidence.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors -and $errors.Count) {
            throw ("Private original capture PowerShell parse errors: " +
              ($errors | ForEach-Object { $_.Message } | Out-String))
          }
      - name: Audit original texture/vertex/index getter aliases
        run: python -m unittest discover -s tests -p test_model2_getter_resource_source.py -v
      - name: Smoke test private session copier (synthetic CSV, fail closed)
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root=Join-Path $env:RUNNER_TEMP "private-original-evidence-smoke"
          $inputs=Join-Path $root "source"
          New-Item -ItemType Directory -Force -Path $inputs | Out-Null
          Copy-Item scripts/Collect-Daytona-Original-Evidence.ps1 $root/
          Copy-Item tools/model2_draw_source_report.py $root/
          Copy-Item tools/model2_world_pass_evidence.py $root/
          foreach($label in @("race_a","race_b","title","menu","sky","hud","aux")){
            $filename=if($label -eq "aux"){"auxiliary.csv"}else{$label+".csv"}
            $fake=Join-Path $inputs $filename
            [IO.File]::WriteAllText($fake,
              ("seq,qpc,thread,event,a0,a1,a2,a3" + "`n" +
               "1,1,1,synthetic_unproven_" + $label + ",0,0,0,0" + "`n"))
          }
          $rejected=$false
          try {
            & (Join-Path $root "Collect-Daytona-Original-Evidence.ps1") `
              -PackageRoot $root -ExistingSessionFolder $inputs
          } catch {
            if($_.Exception.Message -notmatch "FAIL-CLOSED"){ throw }
            $rejected=$true
          }
          if(-not $rejected){ throw "Synthetic controls incorrectly authorized original World3D" }
          $archives=@(Get-ChildItem (Join-Path $root "logs") -Directory)
          if($archives.Count -ne 1){ throw "Expected exactly one local private archive" }
          # New fail-fast behavior: the first fake x86 process must be
          # rejected BEFORE prompting for the other six sessions.
          if(!(Test-Path (Join-Path $archives[0].FullName "race_a.csv"))){
            throw "First original x86 capture was not preserved for diagnosis"
          }
          foreach($label in @("race_b","title","menu","sky","hud","aux")){
            $filename=if($label -eq "aux"){"auxiliary.csv"}else{$label+".csv"}
            if(Test-Path (Join-Path $archives[0].FullName $filename)){
              throw "Invalid first original run should stop before $label"
            }
          }
          if(Test-Path (Join-Path $archives[0].FullName "PRIVATE_MANIFEST.json")){
            throw "Invalid first x86 run created final provenance manifest"
          }
          if(Test-Path (Join-Path $archives[0].FullName "PRIVATE_WORLD_CANDIDATES.json")){
            throw "Invalid first x86 run created a false World3D candidate"
          }
          # Resuming a corrupt original process MUST re-audit its raw CSV,
          # preserve it and require a fresh original process, not accept
          # an old cached source JSON or misrepresent the scene.
          # A previously completed archive may lose original CSV integrity.
          # The first corrupt re-audit must not leave historical success live.
          $oldManifest=Join-Path $archives[0].FullName "PRIVATE_MANIFEST.json"
          $oldCandidates=Join-Path $archives[0].FullName "PRIVATE_WORLD_CANDIDATES.json"
          [IO.File]::WriteAllText($oldManifest,'{"stale":"previous_complete_run"}')
          [IO.File]::WriteAllText($oldCandidates,'{"stale":"previous_complete_run"}')
          $resumeFailed=$false
          try {
            & (Join-Path $root "Collect-Daytona-Original-Evidence.ps1") `
              -PackageRoot $root -ResumeSessionFolder $archives[0].FullName
          } catch {
            if($_.Exception.Message -notmatch "No NEW original x86 source CSV"){ throw }
            $resumeFailed=$true
          }
          if(-not $resumeFailed){ throw "Invalid original stage incorrectly resumed" }
          if(Test-Path (Join-Path $archives[0].FullName "race_a.csv")){
            throw "Invalid original CSV treated as completed resumed stage"
          }
          if(@(Get-ChildItem -LiteralPath $archives[0].FullName -Filter "PRIVATE_FAILED_race_a_*_race_a.csv").Count -ne 1){
            throw "Invalid stage archive was not preserved by resume"
          }
          if(Test-Path (Join-Path $archives[0].FullName "PRIVATE_MANIFEST.json")){
            throw "Old manifest survived failed resume"
          }
          if(Test-Path (Join-Path $archives[0].FullName "PRIVATE_WORLD_CANDIDATES.json")){
            throw "Old candidate survived failed resume"
          }
          foreach($oldName in @("PRIVATE_MANIFEST.json","PRIVATE_WORLD_CANDIDATES.json")){
            $prior=@(Get-ChildItem -LiteralPath $archives[0].FullName -Filter ("PRIVATE_PRIOR_*_"+$oldName))
            if($prior.Count -ne 1){ throw "Historical receipt not preserved: $oldName" }
            $oldContent=Get-Content -LiteralPath $prior[0].FullName -Raw
            if($oldContent -notmatch "previous_complete_run"){ throw "Historical receipt unexpectedly rewritten: $oldName" }
          }
      - name: Reject previously existing original x86 CSV even if retouched
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root=Join-Path $env:RUNNER_TEMP "original-x86-stale-log-smoke"
          $logs=Join-Path $root "logs"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          Copy-Item scripts/Collect-Daytona-Original-Evidence.ps1 $root/
          Copy-Item tools/model2_draw_source_report.py $root/
          Copy-Item tools/model2_world_pass_evidence.py $root/
          # An existing file with a FUTURE mtime used to pass newest-file
          # discovery. A real new original process MUST create a new path.
          $stale=Join-Path $logs "daytona_vr_startup_old.csv"
          [IO.File]::WriteAllText($stale,
            "seq,qpc,thread,event,a0,a1,a2,a3" + "`n" +
            "1,1,1,retouched_old_not_original_run,0,0,0,0" + "`n")
          [IO.File]::SetLastWriteTimeUtc($stale,(Get-Date).ToUniversalTime().AddMinutes(5))
          $rejected=$false
          try {
            # Unattended PowerShell returns empty at the first Read-Host;
            # no real emulator or original game material is executed.
            & (Join-Path $root "Collect-Daytona-Original-Evidence.ps1") -PackageRoot $root
          } catch {
            if($_.Exception.Message -notmatch "No NEW original x86 source CSV"){ throw }
            $rejected=$true
          }
          if(-not $rejected){ throw "Retouched old CSV accepted as a new physical process" }
          if(!(Test-Path -LiteralPath $stale)){ throw "Original stale log unexpectedly moved" }
          $archives=@(Get-ChildItem -LiteralPath $logs -Directory -Filter "private_original_evidence_*")
          if($archives.Count -ne 1){ throw "Expected one local private stage archive" }
          if(@(Get-ChildItem -LiteralPath $archives[0].FullName -File).Count -ne 0){
            throw "False fresh log caused private source output"
          }
      - name: Smoke test archive mutation after per-stage physical preflight
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          # Isolated synthetic analyzer: test the collector's transaction
          # only, never impersonate actual Daytona game-world evidence.
          $syntheticAnalyzer=@'
          import json, os, pathlib, sys, time
          args=sys.argv[1:]
          output=pathlib.Path(args[args.index("--output")+1])
          if "--preflight" in args:
              csv=pathlib.Path(args[args.index("--preflight")+1])
              names=["race_a","race_b","title","menu","sky","hud","auxiliary"]
              nonce=names.index(csv.stem)+1
              output.write_text(json.dumps({"original_capture_run":{"nonce_hex":f"0x{nonce:016x}"}}),encoding="utf-8")
              if csv.stem=="auxiliary" and os.environ.get("MODEL2_INTEGRITY_SMOKE")=="before_compare":
                  (csv.parent/"race_a.csv").write_text("tampered after validated original stage",encoding="utf-8")
          else:
              output.write_text('{"synthetic_test_only":true}',encoding="utf-8")
              if os.environ.get("MODEL2_INTEGRITY_SMOKE")=="after_compare":
                  first=pathlib.Path(args[args.index("--race")+1])
                  (first.parent/"PRIVATE_SOURCE_race_a.json").write_text('{"tampered":true}',encoding="utf-8")
              if os.environ.get("MODEL2_INTEGRITY_SMOKE")=="timeout_after_candidate":
                  # Candidate is now visible, but comparison is NOT complete.
                  time.sleep(30)
          '@
          foreach($mode in @("before_compare","after_compare","timeout_after_candidate")) {
            $root=Join-Path $env:RUNNER_TEMP ("private-original-integrity-"+$mode)
            $inputs=Join-Path $root "source"
            New-Item -ItemType Directory -Force -Path $inputs | Out-Null
            Copy-Item scripts/Collect-Daytona-Original-Evidence.ps1 $root/
            Copy-Item tools/model2_draw_source_report.py $root/
            [IO.File]::WriteAllText((Join-Path $root "model2_world_pass_evidence.py"),
              $syntheticAnalyzer,[Text.UTF8Encoding]::new($false))
            foreach($label in @("race_a","race_b","title","menu","sky","hud","aux")) {
              $filename=if($label -eq "aux"){"auxiliary.csv"}else{$label+".csv"}
              [IO.File]::WriteAllText((Join-Path $inputs $filename),
                ("synthetic original x86 collector transaction only: "+$label+"; not game evidence"))
            }
            $env:MODEL2_INTEGRITY_SMOKE=$mode
            $rejected=$false
            try {
              & (Join-Path $root "Collect-Daytona-Original-Evidence.ps1") -PackageRoot $root -ExistingSessionFolder $inputs -AuditTimeoutSeconds 2
            } catch {
              $expected=if($mode -eq "timeout_after_candidate"){"PRIVATE SESSION COMPARE FAIL-CLOSED: PRIVATE AUDIT TIMEOUT FAIL-CLOSED"}else{"PRIVATE SESSION INTEGRITY FAIL-CLOSED"}
              if($_.Exception.Message -notmatch $expected){ throw }
              $rejected=$true
            } finally {
              $env:MODEL2_INTEGRITY_SMOKE=$null
            }
            if(-not $rejected){ throw "Archive mutation accepted: $mode" }
            $archives=@(Get-ChildItem (Join-Path $root "logs") -Directory -Filter "private_original_evidence_*")
            if($archives.Count -ne 1){ throw "Missing local archive: $mode" }
            $archive=$archives[0].FullName
            if(Test-Path (Join-Path $archive "PRIVATE_MANIFEST.json")){throw "False success receipt: $mode"}
            if(Test-Path (Join-Path $archive "PRIVATE_WORLD_CANDIDATES.json")){throw "False live candidate: $mode"}
            if($mode -eq "after_compare" -and
                @(Get-ChildItem -LiteralPath $archive -Filter "PRIVATE_FAILED_COMPARE_*").Count -ne 1){
              throw "Changed cached audit comparison not quarantined"
            }
            if($mode -eq "timeout_after_candidate" -and
                @(Get-ChildItem -LiteralPath $archive -Filter "PRIVATE_FAILED_COMPARE_*").Count -ne 1){
              throw "Original timed-out comparison candidate not quarantined"
            }
            if($mode -eq "before_compare" -and
                @(Get-ChildItem -LiteralPath $archive -Filter "PRIVATE_FAILED_COMPARE_*").Count -ne 0){
              throw "Comparison must not run after raw original CSV mutation"
            }
          }
      - name: Reject blocked or flooded original private Python auditors
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference="Stop"
          # Only synthetic Python process behavior, not real Daytona frames.
          $stub=@'
          import os, sys, time
          mode=os.environ["MODEL2_AUDIT_CHILD_SMOKE"]
          if mode=="flood":
              sys.stderr.write("synthetic audit error " * 20000)
              sys.stderr.flush()
              sys.exit(9)
          if mode=="hang":
              time.sleep(30)
              sys.exit(0)
          raise RuntimeError("unknown test-only Python auditor mode")
          '@
          foreach($mode in @("flood","hang")) {
            $root=Join-Path $env:RUNNER_TEMP ("original-audit-child-"+$mode)
            $inputs=Join-Path $root "inputs"
            New-Item -ItemType Directory -Force -Path $inputs | Out-Null
            Copy-Item scripts/Collect-Daytona-Original-Evidence.ps1 $root/
            Copy-Item tools/model2_draw_source_report.py $root/
            [IO.File]::WriteAllText((Join-Path $root "model2_world_pass_evidence.py"),
              $stub,[Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText((Join-Path $inputs "race_a.csv"),
              "synthetic 7-stage error-path data, NOT original x86 scene evidence")
            $env:MODEL2_AUDIT_CHILD_SMOKE=$mode
            $timer=[Diagnostics.Stopwatch]::StartNew()
            $rejected=$false
            try {
              & (Join-Path $root "Collect-Daytona-Original-Evidence.ps1") -PackageRoot $root -ExistingSessionFolder $inputs -AuditTimeoutSeconds 2
            } catch {
              $reason=if($mode -eq "hang"){"PRIVATE AUDIT TIMEOUT FAIL-CLOSED"}else{"PRIVATE SESSION PREFLIGHT FAIL-CLOSED"}
              if($_.Exception.Message -notmatch $reason) { throw }
              $rejected=$true
            } finally {
              $env:MODEL2_AUDIT_CHILD_SMOKE=$null
              $timer.Stop()
            }
            if(-not $rejected){throw "Unproven Python auditor accepted: $mode"}
            if($timer.Elapsed.TotalSeconds -gt 15){throw "Original Python audit stalled: $mode"}
            $archives=@(Get-ChildItem -LiteralPath (Join-Path $root "logs") -Directory -Filter "private_original_evidence_*")
            if($archives.Count -ne 1){throw "Missing private original archive: $mode"}
            if(!(Test-Path (Join-Path $archives[0].FullName "race_a.csv"))){throw "Failed original stage CSV lost: $mode"}
            foreach($name in @("PRIVATE_MANIFEST.json","PRIVATE_WORLD_CANDIDATES.json")) {
              if(Test-Path (Join-Path $archives[0].FullName $name)){throw "False original success from $mode"}
            }
          }
      - name: Configure original game x86 hook
        run: cmake -S . -B build-game -A Win32
      - name: Build original game hook/loader
        run: cmake --build build-game --config Release --parallel
      - name: Execute native game source contract tests
        run: ctest --test-dir build-game -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: daytona-game-x86
          path: |
            build-game/Release/Model2VRProbe.dll
            build-game/Release/Model2VRLoader.exe
          if-no-files-found: error
          retention-days: 7

  xr-win64:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure XR D3D11 stereo host x64
        run: cmake -S host -B build-xr -A x64
      - name: Build OpenXR game stereo host
        run: cmake --build build-xr --config Release --parallel
      - name: Verify x86/x64 shared stereo and pose contracts
        run: ctest --test-dir build-xr -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: daytona-xr-x64
          path: build-xr/Release/Model2VROpenXRHost.exe
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: [game-win32, xr-win64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: daytona-game-x86
          path: from-game
      - uses: actions/download-artifact@v4
        with:
          name: daytona-xr-x64
          path: from-xr
      - name: Stage user-ready single package
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item from-game/Model2VRProbe.dll stage/
          Copy-Item from-game/Model2VRLoader.exe stage/
          Copy-Item from-xr/Model2VROpenXRHost.exe stage/
          Copy-Item config/daytona_native_stereo.ini stage/
          Copy-Item scripts/Run-Daytona-NativeStereo.cmd stage/
          Copy-Item scripts/Run-Daytona-VR.bat stage/
          Copy-Item docs/DAYTONA_NATIVE_STEREO.md stage/README-KO.md
          Copy-Item tools/model2_up_draw_outcomes.py stage/Analyze-OriginalUP-Present.py
          Copy-Item tools/model2_camera_state_phase_report.py stage/Analyze-OriginalCamera-Phase.py
           Copy-Item tools/model2_mutation_phase_report.py stage/Analyze-OriginalMutation-Phase.py
          Copy-Item scripts/Analyze-Daytona-UP-Source.cmd stage/
          Copy-Item scripts/Analyze-Daytona-Transform-Source.cmd stage/
          # Complete local-only, seven genuine original x86 session workflow.
          Copy-Item tools/model2_draw_source_report.py stage/
          Copy-Item tools/model2_world_pass_evidence.py stage/
          Copy-Item scripts/Collect-Daytona-Original-Evidence.ps1 stage/
          Copy-Item scripts/Collect-Daytona-Original-Evidence.cmd stage/
          Copy-Item docs/MODEL2_WORLD_PASS_EVIDENCE.md stage/ORIGINAL-WORLD-SOURCE-EVIDENCE.md
          Copy-Item docs/vr_wizard/PLAYTEST.md stage/PLAYTEST-WIZARD.md
          Copy-Item docs/vr_wizard/PHASE_PLAN.md stage/VR-WIZARD-STATUS.md
          $components=@(
            @("stage/Model2VRProbe.dll",0x14c),
            @("stage/Model2VRLoader.exe",0x14c),
            @("stage/Model2VROpenXRHost.exe",0x8664))
          foreach($c in $components) {
            $bytes=[IO.File]::ReadAllBytes((Resolve-Path $c[0]))
            if($bytes.Length -lt 128 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {throw "Not an executable: $($c[0])"}
            $pe=[BitConverter]::ToInt32($bytes,0x3c)
            if($pe -lt 64 -or $pe -gt ($bytes.Length-8)) {throw "Invalid PE: $($c[0])"}
            $machine=[BitConverter]::ToUInt16($bytes,$pe+4)
            if($machine -ne $c[1]) {throw "Wrong PE architecture: $($c[0]) / $machine"}
          }
          Get-ChildItem stage -File | Where-Object {$_.Name -ne 'SHA256_MANIFEST.txt'} | Get-FileHash -Algorithm SHA256 |
            ForEach-Object {"$($_.Hash)  $([IO.Path]::GetFileName($_.Path))"} |
            Out-File -Encoding ascii stage/SHA256_MANIFEST.txt
          Compress-Archive -Path stage/* -DestinationPath DaytonaUSA_NativeStereo_Quest3_Experimental.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DaytonaUSA-NativeStereo-Quest3-Win32-Win64
          path: DaytonaUSA_NativeStereo_Quest3_Experimental.zip
          if-no-files-found: error
          retention-days: 14
