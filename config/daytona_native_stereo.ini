; Daytona USA: opt-in experimental actual D3D9 two-eye GPU redraw.
; Source EXE must match the already inspected ElSemi Model 2 emulator build.
; This is native independent eye DRAW replay, not desktop screen mirroring.
; IPD/world-camera mapping is not yet calibrated; expect image artifacts.
[probe]
enabled=1
d3d9_read_only_probe=1
daytona_native_stereo=1
; 100 milliunits = each eye shifted by 0.10 source-coordinate units.
daytona_eye_shift_milliunits=100
; Existing D3D9 log path minimized; user must not upload any more traces.
d3d9_draw_sample_every=4096
launch_openxr_stereo_host=1
; Never leave the requested VR run silently playing as desktop-only 2D.
require_openxr_host_ready=1
; Host must initialize OpenXR and publish a valid tracked stereo pose first.
openxr_host_ready_timeout_ms=15000
launch_ffb_control_panel=0
; Host status transition logs and F9 local text bug capture.
wizard_health_diagnostics=1
; On first launch, show the original emulator Win32 File/ROM selector and
; physical desktop mouse cursor in the same world-fixed XR 2D cinema quad.
; Once the game produces real frames, original game mono/native stereo wins.
; The OpenXR host accepts Quest Touch aim/trigger on the same menu 2D quad.
; Selection is allowed ONLY on the real foreground emulator HWND with
; matching PID and uncovered target point. Never changes game/FFB input.
; If runtime cannot bind Touch trigger to Boolean, X(left) / A(right)
; button click is the fallback controller selection. Mouse still works.
; Set 0 to disable Quest menu input and keep ordinary Windows/VD mouse.
quest_menu_controller_enabled=1
; Screen placement values are centimetres.
daytona_mono_screen_distance_cm=165
daytona_mono_screen_width_cm=200
log_file=logs/daytona_vr_startup.csv
transform_sample_every=4096
project_sample_every=4096
ffb_sample_every=4096

[hook.transform_point]
enabled=0
rva=0
signature=

[hook.project_vertex]
enabled=0
rva=0
signature=

[hook.ffb_dispatch]
enabled=0
rva=0
signature=

[state]
active_matrix_ptr_rva=0
geometry_stream_ptr_rva=0
ffb_backend_mode_rva=0
ffb_raw_mirror_rva=0
