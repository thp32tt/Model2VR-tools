; Daytona USA / Model 2 Emulator 2D D3D9 evidence-only diagnostic.
; No headset, VR frame publication, game code RVA, FFB router or plugin changes.
[probe]
enabled=1
d3d9_read_only_probe=1
; Record every 128th Draw per family inside each Present frame.
; First Draw and first unique caller are still logged independently.
d3d9_draw_sample_every=128
launch_ffb_control_panel=0
log_file=daytona_2d_probe.csv
transform_sample_every=256
project_sample_every=256
ffb_sample_every=1

[hook.transform_point]
enabled=0
rva=0x0
signature=

[hook.project_vertex]
enabled=0
rva=0x0
signature=

[hook.ffb_dispatch]
enabled=0
rva=0x0
signature=

[state]
active_matrix_ptr_rva=0x0
geometry_stream_ptr_rva=0x0
ffb_backend_mode_rva=0x0
ffb_raw_mirror_rva=0x0
